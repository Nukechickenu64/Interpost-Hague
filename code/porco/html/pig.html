<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porco - Interpost</title>
<link rel="stylesheet" href="device-ui.css">
<link rel="stylesheet" href="style.css">
</head>
<body onselectstart="return false">
<!-- Native 541x315 BYOND outputwindow.browser panel. Only live attributes/actions are shown. -->
<div id="device-frame">
  <div id="topbar">
    <span class="brand">P O R C O</span>
    <span id="connection" title="Server communication status"><i></i>WAITING</span>
    <div id="buttonpanel">
      <a id="pig-link" href="byond://winset?command=Who" title="Show connected players">WHO</a>
      <a id="options-link" href="#" title="Open OOC and other options">OOC</a>
    </div>
  </div>
  <div id="device-glass">
  <div id="statpanel">
  <div id="stats-strip" aria-label="Character attributes">
    <div class="stat-item"><span class="stat-label">ST <small>STRENGTH</small></span><strong id="st">--</strong></div>
    <div class="stat-item"><span class="stat-label">HT <small>HEALTH</small></span><strong id="ht">--</strong></div>
    <div class="stat-item"><span class="stat-label">IN <small>INTELLECT</small></span><strong id="int">--</strong></div>
    <div class="stat-item"><span class="stat-label">DX <small>DEXTERITY</small></span><strong id="dx">--</strong></div>
  </div>
  <div id="action-panel">
    <div id="action-header">
      <span class="tiny-chevron">›</span><span id="section-title">ACTIONS</span>
      <span id="action-count"></span>
    </div>
    <div id="scrollbar_container">
      <div id="scrollbar_content" tabindex="0" aria-label="Available actions">
        <div class="empty-state">Waiting for game actions…</div>
      </div>
    </div>
  </div>
  <div id="tabs-panel">
    <span id="tab-label">TABS</span>
    <div id="dynamicpanel" aria-label="General action tabs"></div>
    <div id="role-divider"></div>
    <div id="dynamicpanel2" aria-label="Role action tabs"></div>
    <span id="tab-hint"></span>
  </div>
</div>
  <div id="device-reflection" aria-hidden="true"></div>
  </div>
  <div class="device-bottom" aria-hidden="true"><span class="device-grille"></span></div>
  <div class="device-screw device-screw-left" aria-hidden="true"></div>
  <div class="device-screw device-screw-right" aria-hidden="true"></div>
</div>
<script src="pig.js"></script>
</body>
</html>
