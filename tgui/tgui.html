<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'/>
    <meta charset='utf-8'/>
    <script>
      window.update = function (dataString) {
        var data = JSON.parse(dataString);
        if (window.tgui) {
          window.tgui.set("config", data.config);
          if (typeof data.data !== 'undefined') {
            window.tgui.set("data", data.data);
            window.tgui.animate("adata", data.data);
          }
        }
      };
    </script>
    <link rel='stylesheet' href='tgui.css'/>
    <style>
      html, body { background: #090a0b !important; color: #c8c1b3 !important; }
      body { scrollbar-base-color: #11100e; scrollbar-face-color: #231816; scrollbar-track-color: #050505; scrollbar-arrow-color: #c79a4b; }
      a { color: #d7b46a !important; }
      button, input, select, textarea { background: #11100e !important; color: #c8c1b3 !important; border-color: #4a4035 !important; }
      .notice { background: #11100e !important; border: 1px solid #4a4035 !important; border-left: 3px solid #8b2f22 !important; color: #c8c1b3 !important; }
    </style>
    <script id='data' type='application/json' data-ref='[ref]'>{}</script>
    <script defer src='tgui.js'></script>
  </head>
  <body class='[style]'>
    <div id='container' class='container'>
      <div class='notice'>
        <span>Loading...</span><br/>
      </div>
    </div>
    <noscript>
      <div class='notice'>
        <span>Javascript is required in order to use this interface.</span>
        <span>Please enable Javascript and restart the game.</span>
      </div>
    </noscript>
  </body>
</html>
