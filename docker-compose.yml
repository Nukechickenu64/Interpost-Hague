services:
  tts:
    build: ./tools/tts
    image: interpost-tts:latest
    restart: unless-stopped
    init: true
    networks:
      - internal
    ports:
      - "127.0.0.1:5000:5000"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    build: ./sql
    image: marrow-db:latest
    restart: unless-stopped
    networks:
      - internal
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - ./sql/test_db:/var/lib/mysql

  game:
    build: .
    image: marrow:latest
    restart: unless-stopped
    environment:
      TTS_HTTP_URL: http://tts:5000
    depends_on:
      tts:
        condition: service_healthy
    networks:
      - internal
    ports:
      - "8000:8000"
    volumes:
      - ./data:/marrow/Marrow/data

networks:
  internal: